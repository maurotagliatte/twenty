# Coolify deployment of this fork (builds the image from source).
#
# Used by the Coolify apps "twenty-production" (branch main) and
# "twenty-preview" (branch preview). Coolify runs compose with
# --project-directory set to the repository root, so the build context "."
# below is the repo root.
#
# Coolify-managed variables:
#   SERVER_URL                   public https URL of the environment (set per app)
#   SERVICE_PASSWORD_POSTGRES    generated per app by Coolify
#   SERVICE_BASE64_64_APPSECRET  generated per app by Coolify
# The domain is attached to the "server" service (port 3000) in Coolify; no
# host ports are published, Traefik routes the traffic.
#
# Coolify also injects every variable defined in the app into each service
# through env_file (.env), so optional Twenty settings (FRONTEND_URL, OAuth,
# SMTP, ...) can be set in Coolify without listing them here.
#
# Multi-workspace (production only):
#   IS_MULTIWORKSPACE_ENABLED     "true" to enable (default false)
#   DEFAULT_SUBDOMAIN             subdomain of the login/default app (default app)
#   FRONTEND_URL                  base domain of the workspaces, e.g.
#                                 https://khard.cloud -> app.khard.cloud is the
#                                 login and <workspace>.khard.cloud the workspaces.
#                                 Leave unset in single-workspace apps.
#   TWENTY_WORKSPACE_ROUTER_RULE  Traefik rule for the workspace subdomains, e.g.
#                                 HostRegexp(`^[a-z0-9-]+[.]khard[.]cloud`)
#                                 (set it as a literal variable). Unset = the
#                                 catch-all router matches nothing.
# The labels below use ${...} interpolation, so "Escape special characters in
# labels" must be disabled for the Coolify app.

services:
  server:
    build:
      context: .
      dockerfile: packages/twenty-docker/twenty/Dockerfile
      target: twenty
    volumes:
      - twenty-local-storage:/app/packages/twenty-server/.local-storage
    expose:
      - "3000"
    environment:
      NODE_PORT: 3000
      SERVER_URL: ${SERVER_URL}
      PG_DATABASE_URL: postgres://postgres:${SERVICE_PASSWORD_POSTGRES}@db:5432/default
      REDIS_URL: redis://redis:6379
      APP_SECRET: ${SERVICE_BASE64_64_APPSECRET}
      STORAGE_TYPE: local
      DISABLE_DB_MIGRATIONS: "false"
      DISABLE_CRON_JOBS_REGISTRATION: "false"
      IS_MULTIWORKSPACE_ENABLED: ${IS_MULTIWORKSPACE_ENABLED:-false}
      DEFAULT_SUBDOMAIN: ${DEFAULT_SUBDOMAIN:-app}
    labels:
      # Catch-all router for workspace subdomains (<workspace>.<front domain>).
      # Low priority so explicit Host() routers of other apps always win.
      # Cloudflare (SSL mode Full) terminates the public TLS; the origin uses
      # Traefik's default certificate.
      - "traefik.http.routers.twenty-ws-${COOLIFY_RESOURCE_UUID}.rule=${TWENTY_WORKSPACE_ROUTER_RULE:-Host(`twenty-workspaces.invalid`)}"
      - "traefik.http.routers.twenty-ws-${COOLIFY_RESOURCE_UUID}.entrypoints=https"
      - "traefik.http.routers.twenty-ws-${COOLIFY_RESOURCE_UUID}.priority=10"
      - "traefik.http.routers.twenty-ws-${COOLIFY_RESOURCE_UUID}.tls=true"
      - "traefik.http.routers.twenty-ws-${COOLIFY_RESOURCE_UUID}.middlewares=gzip-sse"
      - "traefik.http.routers.twenty-ws-${COOLIFY_RESOURCE_UUID}.service=twenty-ws-${COOLIFY_RESOURCE_UUID}"
      - "traefik.http.services.twenty-ws-${COOLIFY_RESOURCE_UUID}.loadbalancer.server.port=3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:3000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    restart: always

  worker:
    build:
      context: .
      dockerfile: packages/twenty-docker/twenty/Dockerfile
      target: twenty
    command: ["yarn", "worker:prod"]
    volumes:
      - twenty-local-storage:/app/packages/twenty-server/.local-storage
    environment:
      NODE_PORT: 3000
      SERVER_URL: ${SERVER_URL}
      PG_DATABASE_URL: postgres://postgres:${SERVICE_PASSWORD_POSTGRES}@db:5432/default
      REDIS_URL: redis://redis:6379
      APP_SECRET: ${SERVICE_BASE64_64_APPSECRET}
      STORAGE_TYPE: local
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
      IS_MULTIWORKSPACE_ENABLED: ${IS_MULTIWORKSPACE_ENABLED:-false}
      DEFAULT_SUBDOMAIN: ${DEFAULT_SUBDOMAIN:-app}
    depends_on:
      db:
        condition: service_healthy
      server:
        condition: service_healthy
    restart: always
    exclude_from_hc: true

  db:
    image: postgres:16
    volumes:
      - twenty-pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: default
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost -d default"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  redis:
    image: redis:7
    command: ["--maxmemory-policy", "noeviction"]
    volumes:
      - twenty-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

# Volume names are intentionally different from the official compose so this
# stack never reuses data volumes left behind by an older deployment of the
# same Coolify app (Postgres would keep the old password).
volumes:
  twenty-pgdata:
  twenty-local-storage:
  twenty-redis:
