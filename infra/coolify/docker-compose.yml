# Coolify stack for the official Twenty image, used to leave the fork.
# Deploy it as a NEW Coolify app with fresh volumes and restore the backup
# into it; never point it at the volumes of twenty-production.
# Runbook: infra/migration/README.md.
#
# Coolify-managed variables:
#   SERVER_URL                   public https URL of this app
#   SERVICE_PASSWORD_POSTGRES    generated by Coolify
#   APP_SECRET                   copy of twenty-production's
#                                SERVICE_BASE64_64_APPSECRET; it encrypts the
#                                stored OAuth tokens and app variables
#   TWENTY_IMAGE_TAG             official tag, e.g. v2.59.3
#   IS_MULTIWORKSPACE_ENABLED, DEFAULT_SUBDOMAIN, FRONTEND_URL,
#   TWENTY_WORKSPACE_ROUTER_RULE Traefik rule for <workspace>.khard.cloud, e.g.
#                                HostRegexp(`^[a-z0-9-]+[.]khard[.]cloud`)
# "Escape special characters in labels" must be disabled for the app.

x-twenty-env: &twenty-env
  NODE_PORT: 3000
  SERVER_URL: ${SERVER_URL}
  PG_DATABASE_URL: postgres://postgres:${SERVICE_PASSWORD_POSTGRES}@db:5432/default
  REDIS_URL: redis://redis:6379
  APP_SECRET: ${APP_SECRET}
  STORAGE_TYPE: local
  IS_MULTIWORKSPACE_ENABLED: ${IS_MULTIWORKSPACE_ENABLED:-false}
  DEFAULT_SUBDOMAIN: ${DEFAULT_SUBDOMAIN:-app}
  # The Khard apps run logic functions; LOCAL has no sandbox, see the runbook.
  LOGIC_FUNCTION_TYPE: ${LOGIC_FUNCTION_TYPE:-LOCAL}

services:
  server:
    image: twentycrm/twenty:${TWENTY_IMAGE_TAG:?set TWENTY_IMAGE_TAG}
    stop_grace_period: 120s
    volumes:
      - twenty-vanilla-local-storage:/app/packages/twenty-server/.local-storage
    expose:
      - "3000"
    environment:
      <<: *twenty-env
      DISABLE_DB_MIGRATIONS: "false"
      DISABLE_CRON_JOBS_REGISTRATION: "false"
    labels:
      - "traefik.http.routers.twenty-ws-${COOLIFY_RESOURCE_UUID}.rule=${TWENTY_WORKSPACE_ROUTER_RULE:-Host(`twenty-workspaces.invalid`)}"
      - "traefik.http.routers.twenty-ws-${COOLIFY_RESOURCE_UUID}.entrypoints=https"
      - "traefik.http.routers.twenty-ws-${COOLIFY_RESOURCE_UUID}.priority=10"
      - "traefik.http.routers.twenty-ws-${COOLIFY_RESOURCE_UUID}.tls=true"
      - "traefik.http.routers.twenty-ws-${COOLIFY_RESOURCE_UUID}.middlewares=gzip-sse"
      - "traefik.http.routers.twenty-ws-${COOLIFY_RESOURCE_UUID}.service=twenty-ws-${COOLIFY_RESOURCE_UUID}"
      - "traefik.http.services.twenty-ws-${COOLIFY_RESOURCE_UUID}.loadbalancer.server.port=3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:3000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    restart: always

  worker:
    image: twentycrm/twenty:${TWENTY_IMAGE_TAG:?set TWENTY_IMAGE_TAG}
    stop_grace_period: 120s
    command: ["yarn", "worker:prod"]
    volumes:
      - twenty-vanilla-local-storage:/app/packages/twenty-server/.local-storage
    environment:
      <<: *twenty-env
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
    depends_on:
      db:
        condition: service_healthy
      server:
        condition: service_healthy
    restart: always
    exclude_from_hc: true

  db:
    image: postgres:16
    volumes:
      - twenty-vanilla-pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: default
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost -d default"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  redis:
    image: redis:7
    command: ["--maxmemory-policy", "noeviction"]
    volumes:
      - twenty-vanilla-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

volumes:
  twenty-vanilla-pgdata:
  twenty-vanilla-local-storage:
  twenty-vanilla-redis:
